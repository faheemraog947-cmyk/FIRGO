name: firgo
description: Pakistan's Premium Ride-Sharing Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  firebase_database: ^10.2.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0

  # State Management
  provider: ^6.2.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # Location & Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0

  # UI & Design
  flutter_screenutil: ^5.9.0
  get: ^4.6.6
  material_design_icons_flutter: ^7.0.7296

  # Payment
  razorpay_flutter: ^1.3.6
  stripe_flutter: ^10.0.0

  # Notifications
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^17.0.0

  # Utils
  intl: ^0.19.0
  image_picker: ^1.0.5
  cached_network_image: ^3.3.1
  http: ^1.1.0
  connectivity_plus: ^5.0.0
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600